name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-toon-light.svg?color_snake=#f2a93b&color_dots=#e9e6f5,#ffc2d4,#ffa3bd,#ff8f7a,#e8604b
            dist/github-snake-toon-dark.svg?color_snake=#f2a93b&color_dots=#1f2747,#4a3d7a,#7458d8,#ff8f7a,#ffc2d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
