<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img"><style>
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1400px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.d{animation:drift linear infinite}.b{animation:bob 3.6s ease-in-out infinite}.bl{animation:blink 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.d,.b,.bl{animation:none}}
